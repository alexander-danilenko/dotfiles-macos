# Load cookies from the Vivaldi browser profile (useful for logged-in sites)
# Syntax: --cookies-from-browser BROWSER[+KEYRING][:PROFILE][::CONTAINER]
--cookies-from-browser vivaldi

# Continue downloads even if individual items or postprocessing fail.
# Useful for large playlists where a single failure shouldn't stop everything.
--ignore-errors

# Format selection with ordered fallbacks for language-specific audio tracks.
# Tries (in order): en+uk+ru, ru+en, uk+en, uk+ru, en, ru, uk, then a general bestaudio.
# Each `ba[language~='^xx']` requests the best audio-only format for that language.
# Note: availability depends on the extractor; final `ba` covers unlabeled tracks.
-f "bv*+ba[language~='^en']+ba[language~='^uk']+ba[language~='^ru'] /
    bv*+ba[language~='^ru']+ba[language~='^en'] /
    bv*+ba[language~='^uk']+ba[language~='^en'] /
    bv*+ba[language~='^uk']+ba[language~='^ru'] /
    bv*+ba[language~='^en'] /
    bv*+ba[language~='^ru'] /
    bv*+ba[language~='^uk'] /
    bv*+ba/b"

# Allow multiple audio streams to be merged into the output file.
# Required when selecting multiple `ba[...]` so each becomes its own audio stream.
--audio-multistreams

# Preferred container used when formats are merged. `mkv` is more flexible,
# but `mp4` is more widely compatible.
--merge-output-format mp4

# Embed metadata (title, artist, date, comment) into the final file.
--embed-metadata

# Embed thumbnail as cover art when possible (requires mutagen/ffmpeg).
--embed-thumbnail

# Embed chapters into the final file if chapter metadata is available.
--embed-chapters

# Subtitle language selection (regex). Applies to both manual and automatic.
--sub-langs en.*,ru.*,uk.*

# Download autogenerated subtitles (automatic captions).
--write-auto-subs

# Embed downloaded subtitles into the final container (requires ffmpeg).
--embed-subs
